name: Build

on:
  release:
    types: [ published, prereleased ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # === Сборка для Windows ===
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./Servo-Modquisitor-2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./Servo-Modquisitor-2/go.sum

      # === Диагностика: показать структуру папок ===
      - name: List files for debugging
        run: |
          echo "Current directory:"
          dir
          echo "winres directory:"
          if exist winres dir winres
        shell: cmd

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      # === Копируем winres.json в корень (если он есть) ===
      - name: Copy winres.json to root (fix)
        run: |
          if exist winres\winres.json (
            copy winres\winres.json .
          ) else (
            echo "winres/winres.json not found!"
            exit 1
          )
        shell: cmd

      - name: Generate resources (icon + version info)
        run: go-winres make

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -ldflags="-s -w -H=windowsgui" -o servo-modquisitor.exe .

      - name: Prepare files for packaging (Windows)
        run: |
          mkdir Servo-Modquisitor-2
          copy servo-modquisitor.exe Servo-Modquisitor-2\
          copy ..\SortingRules_and_ModDatabase\mandatory_obsolete_incompatible_dependencies.json Servo-Modquisitor-2\
          copy ..\SortingRules_and_ModDatabase\mod_database.json Servo-Modquisitor-2\

      - name: Package Windows (zip)
        run: |
          7z a -tzip Servo-Modquisitor-2-windows.zip .\Servo-Modquisitor-2\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: servo-modquisitor-windows
          path: ./Servo-Modquisitor-2/Servo-Modquisitor-2-windows.zip

  # === Сборка для Linux ===
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Servo-Modquisitor-2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./Servo-Modquisitor-2/go.sum

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-x11-dev libgtk-3-dev

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -ldflags="-s -w" -o servo-modquisitor-linux .

      - name: Prepare files for packaging (Linux)
        run: |
          mkdir Servo-Modquisitor-2
          cp servo-modquisitor-linux Servo-Modquisitor-2/
          cp ../SortingRules_and_ModDatabase/mandatory_obsolete_incompatible_dependencies.json Servo-Modquisitor-2/
          cp ../SortingRules_and_ModDatabase/mod_database.json Servo-Modquisitor-2/
          chmod +x Servo-Modquisitor-2/servo-modquisitor-linux

      - name: Package Linux (tar.gz)
        run: tar -czvf Servo-Modquisitor-2-linux.tar.gz Servo-Modquisitor-2/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: servo-modquisitor-linux
          path: ./Servo-Modquisitor-2/Servo-Modquisitor-2-linux.tar.gz

  # === Загрузка архивов в релиз (при публикации) ===
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && (github.event.action == 'published' || github.event.action == 'prereleased')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/servo-modquisitor-windows/Servo-Modquisitor-2-windows.zip
            artifacts/servo-modquisitor-linux/Servo-Modquisitor-2-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # === Публикация на Nexus Mods ===
  upload-nexus:
    name: Upload to Nexus Mods
    runs-on: ubuntu-latest
    needs: release
    # Только для полноценных релизов (не пре-релизов)
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
    steps:
      - name: Download artifacts from release
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Linux tar.gz inside zip (for Nexus)
        run: |
          # Находим Linux tar.gz
          linux_tar=$(find artifacts -name "*.tar.gz" | head -n 1)
          if [ -n "$linux_tar" ]; then
            # Копируем tar.gz как есть, но упаковываем в zip
            cp "$linux_tar" ./Servo-Modquisitor-2-linux.tar.gz
            zip Servo-Modquisitor-2-linux.zip Servo-Modquisitor-2-linux.tar.gz
          fi

      - name: Find Windows zip
        id: find_win
        run: |
          WIN_ZIP=$(find artifacts -name "*.zip" ! -name "*linux*" | head -n 1)
          echo "win_zip=$WIN_ZIP" >> $GITHUB_OUTPUT

      - name: Install NexusUploader
        run: dotnet tool install --global BUTR.NexusUploader

      - name: Upload Windows to Nexus
        env:
          UNEX_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}
        run: |
          butr-nexusuploader upload \
            --game "warhammer40kdarktide" \
            --mod ${{ vars.NEXUS_MOD_ID }} \
            --file "${{ steps.find_win.outputs.win_zip }}" \
            --version "2.9.21" \
            --name "Servo-Modquisitor-2-windows.zip" \
            --changelog "See changelog"

      - name: Upload Linux to Nexus
        env:
          UNEX_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}
        run: |
          butr-nexusuploader upload \
            --game "warhammer40kdarktide" \
            --mod ${{ vars.NEXUS_MOD_ID }} \
            --file "Servo-Modquisitor-2-linux.zip" \
            --version "2.9.21" \
            --name "Servo-Modquisitor-2-linux.zip" \
            --changelog "See changelog"
